services:
  react-app:
    build:
      context: .
      dockerfile: WebChat/ClientApp/Dockerfile
    ports:
      - '3000:3000'
    # Where vite.config.ts proxies /api, /chat and /images. Its default is
    # https://localhost:7199 - the Kestrel port on a developer's machine - which inside this
    # container resolves to the container itself and refuses the connection. The client then
    # reports "Cannot reach the server", because a 502 from the dev proxy is indistinguishable
    # from the API being down.
    #
    # HTTPS rather than :8080, because the API redirects HTTP to HTTPS and the dev proxy does
    # not follow redirects - the browser would be sent to an address only reachable inside the
    # compose network. The self-signed certificate is accepted via secure:false.
    environment:
      - VITE_API_PROXY_TARGET=https://webchat-api:8443
    volumes:
      - ./WebChat/ClientApp:/app
      # Anonymous volume keeps the image's node_modules from being masked by the
      # bind mount above - without it the dev server has no dependencies to run.
      - /app/node_modules
  postgres:
    # Replaces SQL Server: Postgres runs comfortably in a fraction of the memory, which is
    # what decides the droplet size this deploys onto. SQL Server needs ~2 GB to start at all.
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: WebChat
      POSTGRES_USER: webchat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and fill it in}
    # Published on 5433 because a workstation with Postgres installed natively already
    # holds 5432, and the bind would fail. Nothing in the stack uses this mapping - the
    # API reaches the database as postgres:5432 over the compose network - it exists
    # only so psql/pgAdmin on the host can reach the containerised instance.
    ports:
      - '5433:5432'
    volumes:
      # Postgres 18 moved the data directory one level down, into a version-named
      # subdirectory of /var/lib/postgresql, so that pg_upgrade --link can work across a
      # single mount. Mounting the old /var/lib/postgresql/data path makes the entrypoint
      # refuse to start outright rather than silently ignoring the volume.
      - webchat-db:/var/lib/postgresql
    # The API retries while the database starts, but a healthcheck keeps the log quiet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webchat -d WebChat"]
      interval: 5s
      timeout: 3s
      retries: 10
  webchat-api:
    build:
      context: .
      dockerfile: WebChat/Dockerfile
    ports:
      - '8080:8080'
      - '8081:8443'
    # Values come from .env in this directory, which compose loads automatically. The `:?`
    # forms stop the command naming the missing variable rather than substituting an empty
    # string - an empty password would otherwise reach Postgres and the API separately and
    # fail much further downstream.
    #
    # Nothing here is baked into an image: these are injected at run time, and ASP.NET Core
    # maps them onto config keys with __ as the section separator. Deploying means setting
    # the same names as platform environment variables, with no .env file involved.
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # .NET 8+ containers run as non-root, so Kestrel binds unprivileged ports.
      - ASPNETCORE_URLS=https://+:8443;http://+:8080
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${CERT_PASSWORD:?password used when exporting aspnetapp.pfx}
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - ASPNETCORE_HTTPS_PORT=8081
      # Built from POSTGRES_PASSWORD so the database and the client that connects to it
      # cannot drift apart.
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=WebChat;Username=webchat;Password=${POSTGRES_PASSWORD:?copy .env.example to .env and fill it in}
      # Quoted because the `:?` message would otherwise contain ": ", which YAML reads as a
      # key/value separator and turns this list item into a map.
      - "JWTSecretKey=${JWT_SECRET_KEY:?generate one with `openssl rand -base64 48`}"
      # No `:?` - blank is a supported configuration. Startup.AddAvatarStorage falls back to
      # local disk when a credential is missing, so a clone with no Cloudflare account runs.
      - R2__AccountId=${R2_ACCOUNT_ID}
      - R2__AccessKeyId=${R2_ACCESS_KEY_ID}
      - R2__SecretAccessKey=${R2_SECRET_ACCESS_KEY}
      # Also no `:?` - blank selects the sender that only logs, so the stack runs without a
      # Brevo account and the confirmation link shows up in `docker compose logs webchat-api`.
      - Email__SmtpUser=${EMAIL_SMTP_USER}
      - Email__SmtpKey=${EMAIL_SMTP_KEY}
      - Email__FromAddress=${EMAIL_FROM_ADDRESS}
      # The confirmation link must point where a browser can reach, not at the container.
      - App__PublicUrl=https://localhost:8081
      - SpaDevServerUrl=http://react-app:3000
      - Cors__AllowedOrigins__0=http://localhost:3000
      - Cors__AllowedOrigins__1=https://localhost:8081
      # No `:?` - a stack with nobody configured is fine, it just has no admin console.
      # Promotion is idempotent and requires a confirmed account, so leaving this set does
      # nothing on every boot after the first.
      - Admin__BootstrapOwners__0=${ADMIN_BOOTSTRAP_OWNER}
    volumes:
      - ~/.aspnet/https:/https:ro
      - webchat-avatars:/src/wwwroot/images
    depends_on:
      postgres:
        condition: service_healthy
      react-app:
        condition: service_started

volumes:
  webchat-avatars:
  webchat-db:
