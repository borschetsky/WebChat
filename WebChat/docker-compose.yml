services:
  react-app:
    build:
      context: .
      dockerfile: WebChat/ClientApp/Dockerfile
    ports:
      - '3000:3000'
    # Where vite.config.ts proxies /api, /chat and /images. Its default is
    # https://localhost:7199 - the Kestrel port on a developer's machine - which inside this
    # container resolves to the container itself and refuses the connection. The client then
    # reports "Cannot reach the server", because a 502 from the dev proxy is indistinguishable
    # from the API being down.
    #
    # HTTPS rather than :8080, because the API redirects HTTP to HTTPS and the dev proxy does
    # not follow redirects - the browser would be sent to an address only reachable inside the
    # compose network. The self-signed certificate is accepted via secure:false.
    environment:
      - VITE_API_PROXY_TARGET=https://webchat-api:8443
    volumes:
      - ./WebChat/ClientApp:/app
      # Anonymous volume keeps the image's node_modules from being masked by the
      # bind mount above - without it the dev server has no dependencies to run.
      - /app/node_modules
  postgres:
    # Replaces SQL Server: Postgres runs comfortably in a fraction of the memory, which is
    # what decides the droplet size this deploys onto. SQL Server needs ~2 GB to start at all.
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: WebChat
      POSTGRES_USER: webchat
      POSTGRES_PASSWORD: a80a7cac-3775-41bd-a997-16b300780655
    # Published on 5433 because a workstation with Postgres installed natively already
    # holds 5432, and the bind would fail. Nothing in the stack uses this mapping - the
    # API reaches the database as postgres:5432 over the compose network - it exists
    # only so psql/pgAdmin on the host can reach the containerised instance.
    ports:
      - '5433:5432'
    volumes:
      # Postgres 18 moved the data directory one level down, into a version-named
      # subdirectory of /var/lib/postgresql, so that pg_upgrade --link can work across a
      # single mount. Mounting the old /var/lib/postgresql/data path makes the entrypoint
      # refuse to start outright rather than silently ignoring the volume.
      - webchat-db:/var/lib/postgresql
    # The API retries while the database starts, but a healthcheck keeps the log quiet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webchat -d WebChat"]
      interval: 5s
      timeout: 3s
      retries: 10
  webchat-api:
    build:
      context: .
      dockerfile: WebChat/Dockerfile
    ports:
      - '8080:8080'
      - '8081:8443'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # .NET 8+ containers run as non-root, so Kestrel binds unprivileged ports.
      - ASPNETCORE_URLS=https://+:8443;http://+:8080
      - ASPNETCORE_Kestrel__Certificates__Default__Password=8175
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - ASPNETCORE_HTTPS_PORT=8081
      - SpaDevServerUrl=http://react-app:3000
      - Cors__AllowedOrigins__0=http://localhost:3000
      - Cors__AllowedOrigins__1=https://localhost:8081
    volumes:
      - ~/.aspnet/https:/https:ro
      - webchat-avatars:/src/wwwroot/images
    depends_on:
      postgres:
        condition: service_healthy
      react-app:
        condition: service_started

volumes:
  webchat-avatars:
  webchat-db:
